<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Music Base</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="splash-body">
    <div class="splash">
      <img class="splash-logo" src="../assets/emblem.png" alt="Эмблема Music Base" id="splash-logo" />
      <p id="splash-present">Cinailo Corporation Presents</p>
      <div class="splash-line" aria-hidden="true"><span></span></div>
    </div>
    <script>
      const language = new URLSearchParams(location.search).get('language');
      const labels = {
        ru: 'Cinailo Corporation представляет',
        en: 'Cinailo Corporation Presents',
        uk: 'Cinailo Corporation представляє'
      };
      if (labels[language]) {
        document.documentElement.lang = language;
        document.getElementById('splash-present').textContent = labels[language];
        document.getElementById('splash-logo').alt = language === 'en' ? 'Music Base emblem' : language === 'uk' ? 'Емблема Music Base' : 'Эмблема Music Base';
      }
    </script>
  </body>
</html>
